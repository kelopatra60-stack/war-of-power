name: Build War of Power APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the game (one HTML file)
        run: |
          python3 web/tools/build.py
          mkdir -p app/src/main/assets/www
          cp web/dist/war-of-power.html app/src/main/assets/www/index.html
          ls -la app/src/main/assets/www

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/War-of-Power-v1.0.${{ github.run_number }}.apk"

      - name: Upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: War-of-Power-APK
          path: out/*.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: War of Power v1.0.${{ github.run_number }}
          body: "APK built automatically from the latest code — download the .apk file below and install it on your phone."
          files: out/*.apk
